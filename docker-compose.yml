version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: doc_assistant_postgres
    environment:
      POSTGRES_DB: doc_assistant_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: